# CANopen master configuration for the Moons' MBDV-2X-520AC dual-axis servo drive.
#
# Generated DCF/BIN with:
#   dcfgen -r -d config config/master.yaml
#
# NOTE on transmission types
# ------------------------
# The drive ships 0x1401:02 and 0x1402:02 (RPDO2 / RPDO3 transmission type) with the
# value 0xFE. The low two bits of a CiA 301 transmission type select the trigger mode,
# and 0xFE = 0b1111_1110 has low bits 10b == "RTR only". An RPDO left in that mode
# silently discards normally-transmitted frames, so target position / target velocity
# commands would never be acted upon.
#
# Every PDO below therefore sets `transmission: 255` (0xFF, low bits 11b == event
# driven), which is also the value the drive itself uses for RPDO1 and the TPDOs.
#
# The C++ driver additionally programs and verifies the whole PDO layout at runtime in
# stage S09, so a wrong value here cannot silently break motion control: S09 fails and
# names the exact object and sub-index.
#
# CiA 301 PDO COB-ID validity rule
# --------------------------------
# In CiA 301, bit 31 of COB-ID (0x140x:01 / 0x180x:01) indicates validity:
# - bit 31 = 0: PDO exists and is valid (ENABLED).
# - bit 31 = 1: PDO does not exist or is invalid (DISABLED).
# dcfgen correctly emits bit 31 = 0 for enabled PDOs, and stage S09 verifies
# this on the drive at runtime.

master:
  node_id: 127
  baudrate: 500 # 500 kbps (MBDV DIP SW7 = 1)
  sync_period: 10000 # 10 ms
  heartbeat_multiplier: 1.5

slave_1:
  dcf: config/CANOPEN-EDS-MBDV-Servo-DulAxes-V1.0.eds
  node_id: 1
  boot: true
  mandatory: true
  # CAN-loss detection: lely's boot-slave process writes 0x1017 = 100 ms (concise DCF) on
  # EVERY boot, so a drive restarted after a heartbeat timeout comes back at the fast period
  # instead of its stored 1000 ms, which would trip the consumer and get it reset forever.
  # Master 0x1016 for this node = 100 x 3.0 = 300 ms. Keep in step with config/params.yaml.
  heartbeat_producer: 100
  heartbeat_multiplier: 3.0
  # ---- RPDO: master -> drive ----
  rpdo:
    1:                              # COB-ID 0x200 + node
      enabled: true
      cob_id: auto
      transmission: 255             # 0xFF event driven (drive default)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x6060, sub_index: 0 } # Modes of operation (8-bit)
    2:                              # COB-ID 0x300 + node
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x607A, sub_index: 0 } # Target position (32-bit)
    3:                              # COB-ID 0x400 + node
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x60FF, sub_index: 0 } # Target velocity (32-bit)
  # ---- TPDO: drive -> master ----
  # Event timers must equal rates.tpdo*_event_ms in config/params.yaml: stage S09 compares
  # against those and re-programs every PDO that differs, on every boot.
  tpdo:
    1:                              # COB-ID 0x180 + node, 5 ms Statusword
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 5
      mapping:
        - { index: 0x6041, sub_index: 0 } # Statusword (16-bit)
    2:                              # COB-ID 0x280 + node, 5 ms position + velocity
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 5
      mapping:
        - { index: 0x6064, sub_index: 0 } # Position actual value (32-bit)
        - { index: 0x606C, sub_index: 0 } # Velocity actual value (32-bit)
    3:                              # COB-ID 0x380 + node, 50 ms live fault diagnosis
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 50
      mapping:
        - { index: 0x603F, sub_index: 0 } # CiA 402 error code (16-bit)
        - { index: 0x200F, sub_index: 0 } # DSP alarm code (32-bit)

slave_2:
  dcf: config/CANOPEN-EDS-MBDV-Servo-DulAxes-V1.0.eds
  node_id: 2
  boot: true
  mandatory: true
  # Same as slave_1: 0x1017 = 100 ms on every boot, master 0x1016 = 300 ms.
  heartbeat_producer: 100
  heartbeat_multiplier: 3.0
  rpdo:
    1:
      enabled: true
      cob_id: auto
      transmission: 255
      mapping:
        - { index: 0x6040, sub_index: 0 }
        - { index: 0x6060, sub_index: 0 }
    2:
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 }
        - { index: 0x607A, sub_index: 0 }
    3:
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 }
        - { index: 0x60FF, sub_index: 0 }
  tpdo:                             # same event timers as slave_1 and params.yaml
    1:
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 5
      mapping:
        - { index: 0x6041, sub_index: 0 }
    2:
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 5
      mapping:
        - { index: 0x6064, sub_index: 0 }
        - { index: 0x606C, sub_index: 0 }
    3:
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 50
      mapping:
        - { index: 0x603F, sub_index: 0 }
        - { index: 0x200F, sub_index: 0 }
    4:
      enabled: false
      cob_id: auto