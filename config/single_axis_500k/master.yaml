# Single-axis CANopen master configuration (MBDV Axis 1, Node ID 1, 500 kbps).
#
# See config/master.yaml for the full explanation of the transmission-type values and
# of the dcfgen `enabled` caveat. Stage S09 of the driver re-enables every PDO and
# verifies the mapping at runtime, so the final drive state is correct regardless of
# what dcfgen emits.

master:
  node_id: 127
  baudrate: 500 # 500 kbps (MBDV DIP SW7 = 1)
  sync_period: 10000 # 10 ms
  heartbeat_multiplier: 1.5

slave_1:
  dcf: config/single_axis_500k/CANOPEN-EDS-MBDV-Servo-DulAxes-V1.0.eds
  node_id: 1 # Axis 1 Node ID = 1 (SW1=1, SW2=0, SW3=0)
  boot: true
  mandatory: true
  # ---- RPDO: master -> drive ----
  rpdo:
    1:                              # COB-ID 0x200 + node
      enabled: true
      cob_id: auto
      transmission: 255             # 0xFF event driven (drive default)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x6060, sub_index: 0 } # Modes of operation (8-bit)
    2:                              # COB-ID 0x300 + node
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x607A, sub_index: 0 } # Target position (32-bit)
    3:                              # COB-ID 0x400 + node
      enabled: true
      cob_id: auto
      transmission: 255             # CRITICAL: drive default is 0xFE (RTR only)
      mapping:
        - { index: 0x6040, sub_index: 0 } # Controlword (16-bit)
        - { index: 0x60FF, sub_index: 0 } # Target velocity (32-bit)
  # ---- TPDO: drive -> master ----
  tpdo:
    1:                              # COB-ID 0x180 + node, 10 ms cyclic Statusword
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 10
      mapping:
        - { index: 0x6041, sub_index: 0 } # Statusword (16-bit)
    2:                              # COB-ID 0x280 + node, 10 ms position + velocity
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 10
      mapping:
        - { index: 0x6064, sub_index: 0 } # Position actual value (32-bit)
        - { index: 0x606C, sub_index: 0 } # Velocity actual value (32-bit)
    3:                              # COB-ID 0x380 + node, 100 ms live fault diagnosis
      enabled: true
      cob_id: auto
      transmission: 255
      event_timer: 100
      mapping:
        - { index: 0x603F, sub_index: 0 } # CiA 402 error code (16-bit)
        - { index: 0x200F, sub_index: 0 } # DSP alarm code (32-bit)